[project]
name = "survey-pal-backend-server"
version = "0.1.0"
description = "Survey Pal backend API server"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.6,<6",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28,<1",
    "argon2-cffi>=23.1,<24",
    "prometheus-client>=0.23,<1",
    "pydantic-settings>=2.12,<3",
    "PyJWT[crypto]>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=5.0.3,<6.5",
    "sentry-sdk[fastapi]>=2.50,<3",
    "sqlalchemy[asyncio]>=2.0.45,<3",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true