services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: survey_pal
      POSTGRES_USER: survey_pal
      POSTGRES_PASSWORD: survey_pal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey_pal -d survey_pal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-broker:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://survey_pal:survey_pal@postgres:5432/survey_pal
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_BROKER_URL: redis://redis-broker:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://survey_pal:survey_pal@postgres:5432/survey_pal
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_BROKER_URL: redis://redis-broker:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

volumes:
  postgres_data:
